[package]
name = "rusty-qr-ffi"
version = "0.1.0"
edition = "2021"

[lib]
name = "rusty_qr_ffi"
# No "lib"/"rlib": no Rust crate links this one, and an rlib among the outputs makes Cargo
# drop `-C lto` without a warning. So keep tests in `#[cfg(test)]` modules (files under
# `tests/` cannot `use rusty_qr_ffi`). Doc examples here are never compiled; put examples
# in `rusty-qr-core`.
crate-type = ["cdylib", "staticlib"]

[dependencies]
rusty-qr-core = { path = "../core" }
thiserror = "2"
uniffi = { version = "=0.32.0", features = ["cli"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
