[package]
name = "rusty-qr-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rusty-qr-core = { path = "../core" }
# Both wasm-bindgen crates move together: the CLI wasm-pack runs must match the lockfile version.
wasm-bindgen = "=0.2.130"

[dev-dependencies]
wasm-bindgen-test = "=0.3.80"

[lints]
workspace = true
