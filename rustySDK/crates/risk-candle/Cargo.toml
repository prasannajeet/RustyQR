[package]
name = "rusty-qr-risk-candle"
version = "0.1.0"
edition = "2021"

[dependencies]
rusty-qr-core = { path = "../core" }
candle-core = { version = "0.11.1", default-features = false }
candle-nn = { version = "0.11.1", default-features = false }
candle-transformers = { version = "0.11.1", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }

# tokenizers' default features compile C (onig) and C++ (esaxx) code, which complicates cross-compiling for
# Android, iOS and wasm. fancy-regex is a pure-Rust regex engine; unstable_wasm adds it plus getrandom's wasm backend.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokenizers = { version = "0.23.2", default-features = false, features = ["unstable_wasm"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "risk_benchmarks"
harness = false

[lints]
workspace = true
