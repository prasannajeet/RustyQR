# cargo-deny configuration — supply chain auditing (PRD 5.4)
# Run: cargo deny check

[advisories]
# Tolerated unmaintained-crate advisories (deliberately NOT in `ignore`; no fix is available yet):
#   RUSTSEC-2025-0141  bincode     via UniFFI 0.28; removed by the UniFFI 0.32 upgrade (spec 1.2)
#   RUSTSEC-2024-0436  paste       via UniFFI 0.28; removed by the UniFFI 0.32 upgrade (spec 1.2)
#   RUSTSEC-2026-0374  basic-toml  via uniffi_bindgen -> askama; removed when crates/uniffi-bindgen
#                                  and the `cli` feature go (spec 1.4)
# Any other advisory, licence, ban or source failure is real.
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.8

# Our own workspace crates are unlicensed (portfolio project, not published).
[[licenses.clarify]]
name = "rusty-qr-core"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "rusty-qr-ffi"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "uniffi-bindgen"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "allow"  # path deps don't need version specifiers

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
