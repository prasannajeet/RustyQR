# cargo-deny configuration — supply chain auditing (PRD 5.4)
# Run: cargo deny check

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.8

# Our own workspace crates are unlicensed (portfolio project, not published).
[[licenses.clarify]]
name = "rusty-qr-core"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "rusty-qr-ffi"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "allow"  # path deps don't need version specifiers

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
