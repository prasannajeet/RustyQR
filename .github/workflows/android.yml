name: Android Build

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: "30.0.14904198"
  # Gradle reads this as -PndkVersion for every invocation, so the configuration cache sees one configuration.
  ORG_GRADLE_PROJECT_ndkVersion: "30.0.14904198"

jobs:
  rust-checks:
    name: Rust tests & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rustySDK

    steps:
      - uses: actions/checkout@v4

      # Pinned: pedantic Clippy with -D warnings can break on a floating toolchain when a new lint ships.
      - uses: dtolnay/rust-toolchain@1.94.1
        id: toolchain
        with:
          components: clippy, rustfmt

      # Cache Rust build artifacts — keyed on Cargo.lock so it busts on dependency changes
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            rustySDK/target/
          key: rust-check-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('rustySDK/Cargo.lock') }}
          restore-keys: rust-check-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # Supply chain: advisories, licences, bans and sources (Docker action, Linux only).
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rustySDK/Cargo.toml

  wasm:
    name: WebAssembly package
    # Pinned image: its Chrome and ChromeDriver are what the headless tests use.
    runs-on: ubuntu-24.04
    env:
      WASM_PACK_VERSION: "0.15.1"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.94.1
        id: toolchain
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            rustySDK/target/
          key: rust-wasm-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('rustySDK/Cargo.lock') }}
          restore-keys: rust-wasm-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      # wasm-pack downloads the wasm-bindgen CLI and wasm-opt here; the CLI version follows Cargo.lock.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/.wasm-pack
          key: wasm-pack-tools-${{ runner.os }}-${{ hashFiles('rustySDK/Cargo.lock') }}

      # wasm-pack is compiled from source, so cache the binary per wasm-pack version and toolchain.
      - id: wasm-pack-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ env.WASM_PACK_VERSION }}

      - if: steps.wasm-pack-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --locked --version "$WASM_PACK_VERSION"

      - run: cargo clippy -p rusty-qr-wasm --target wasm32-unknown-unknown --all-targets --manifest-path rustySDK/Cargo.toml -- -D warnings

      # The runner image ships Google Chrome and a matching ChromeDriver; wasm-pack downloads a matching
      # driver itself if it cannot find one.
      - run: wasm-pack test --headless --chrome rustySDK/crates/wasm

      - run: wasm-pack build rustySDK/crates/wasm --target web --release

      - name: Report wasm size
        run: |
          wasm=rustySDK/crates/wasm/pkg/rusty_qr_wasm_bg.wasm
          echo "raw: $(wc -c < "$wasm") bytes"
          echo "gzip -9: $(gzip -9 -c "$wasm" | wc -c) bytes"

  android-build:
    name: Android APK
    runs-on: ubuntu-latest
    needs: rust-checks

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # --- Rust toolchain (the UniFFI Gradle plugin runs cargo itself) ---
      - uses: dtolnay/rust-toolchain@1.94.1
        id: toolchain
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      # Cargo registry and Rust build artifacts (Android ABIs plus the host library for the JVM tests).
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            rustySDK/target/
          key: rust-android-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('rustySDK/Cargo.lock') }}
          restore-keys: rust-android-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      # The Kotlin bindgen the plugin compiles with `cargo install` on its first run (several minutes). Keyed on the
      # plugin version alone, so a library bump does not discard the Rust build cache above.
      - id: plugin-version
        run: |
          version="$(sed -nE 's/^uniffi-plugin *= *"([^"]+)".*/\1/p' gradle/libs.versions.toml)"
          test -n "$version" || { echo "uniffi-plugin version not found in gradle/libs.versions.toml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: build/uniffi/bindgen/
          key: uniffi-bindgen-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ steps.plugin-version.outputs.version }}

      # --- Android SDK + NDK (the build pins it with ORG_GRADLE_PROJECT_ndkVersion) ---
      - uses: android-actions/setup-android@v3

      - uses: actions/cache@v4
        id: cache-ndk
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ runner.os }}-${{ env.NDK_VERSION }}

      - if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;$NDK_VERSION"

      # The plugin silently falls back to the newest NDK when the pinned folder is missing, so fail here instead.
      - run: |
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt" \
            || { echo "Pinned NDK $NDK_VERSION is not installed under $ANDROID_HOME/ndk" >&2; exit 1; }

      # --- Gradle (dependency, wrapper and build caches) ---
      - uses: gradle/actions/setup-gradle@v5

      # --- Bindings module tests (builds the host Rust library and generates the bindings) ---
      - run: ./gradlew :rustyqr-bindings:jvmTest

      # --- App unit tests and debug APK (Rust for all three ABIs, built by the plugin) ---
      - run: ./gradlew :composeApp:testAndroidHostTest :androidApp:assembleDebug

      # --- Kotlin lint (SwiftLint is macOS only and runs in the iOS workflow) ---
      - run: ./gradlew :composeApp:ktlintCheck :composeApp:detekt :rustyqr-bindings:ktlintCheck :rustyqr-bindings:detekt :androidApp:ktlintCheck :androidApp:detekt

      # --- Upload APK as artifact ---
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 7
