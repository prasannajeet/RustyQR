name: Android Build

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: "30.0.14904198"

jobs:
  rust-checks:
    name: Rust tests & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rustySDK

    steps:
      - uses: actions/checkout@v4

      # Pinned: pedantic Clippy with -D warnings can break on a floating toolchain when a new lint ships.
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt

      # Cache Rust build artifacts — keyed on Cargo.lock so it busts on dependency changes
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            rustySDK/target/
          key: rust-check-${{ runner.os }}-${{ hashFiles('rustySDK/Cargo.lock') }}
          restore-keys: rust-check-${{ runner.os }}-

      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  android-build:
    name: Android APK
    runs-on: ubuntu-latest
    needs: rust-checks

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # --- Rust toolchain (the UniFFI Gradle plugin runs cargo itself) ---
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      # Cargo registry and Rust build artifacts (Android ABIs plus the host library for the JVM tests), and the
      # Kotlin bindgen the plugin compiles with `cargo install` on its first run (several minutes).
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            rustySDK/target/
            build/uniffi/bindgen/
          key: rust-android-${{ runner.os }}-${{ hashFiles('rustySDK/Cargo.lock', 'gradle/libs.versions.toml') }}
          restore-keys: rust-android-${{ runner.os }}-

      # --- Android SDK + NDK (the plugin picks the newest installed NDK) ---
      - uses: android-actions/setup-android@v3

      - uses: actions/cache@v4
        id: cache-ndk
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ runner.os }}-${{ env.NDK_VERSION }}

      - if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}"

      # --- Gradle (dependency, wrapper and build caches) ---
      - uses: gradle/actions/setup-gradle@v5

      # --- Bindings module tests (builds the host Rust library and generates the bindings) ---
      - run: ./gradlew :rustyqr-bindings:jvmTest

      # --- App unit tests and debug APK (Rust for all three ABIs, built by the plugin) ---
      - run: ./gradlew :composeApp:testDebugUnitTest :composeApp:assembleDebug

      # --- Kotlin lint (SwiftLint is macOS only and runs in the iOS workflow) ---
      - run: ./gradlew :composeApp:ktlintCheck :composeApp:detekt :rustyqr-bindings:ktlintCheck :rustyqr-bindings:detekt

      # --- Upload APK as artifact ---
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk
          retention-days: 7
