name: iOS Build

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    name: Rust tests & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rustySDK

    steps:
      - uses: actions/checkout@v4

      # Pinned: pedantic Clippy with -D warnings can break on a floating toolchain when a new lint ships.
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt

      # Cache Rust build artifacts — keyed on Cargo.lock so it busts on dependency changes
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            rustySDK/target/
          key: rust-check-${{ runner.os }}-${{ hashFiles('rustySDK/Cargo.lock') }}
          restore-keys: rust-check-${{ runner.os }}-

      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  ios-build:
    name: iOS App
    runs-on: macos-latest
    needs: rust-checks

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # --- Pin Xcode version to match the one specified in iosApp/project.yml ---
      # The macos-26 image (macos-latest) has several Xcode versions; 26.4 resolves to 26.4.1.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4'

      # --- Rust toolchain (the UniFFI Gradle plugin and Xcode run cargo; the host target is built too) ---
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      # --- Install XcodeGen ---
      - run: brew install xcodegen

      # Cargo registry and Rust build artifacts, and the Kotlin bindgen the plugin compiles with
      # `cargo install` on its first run (several minutes).
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            rustySDK/target/
            build/uniffi/bindgen/
          key: rust-ios-${{ runner.os }}-${{ hashFiles('rustySDK/Cargo.lock', 'gradle/libs.versions.toml') }}
          restore-keys: rust-ios-${{ runner.os }}-

      # --- Gradle (dependency, wrapper and build caches) ---
      - uses: gradle/actions/setup-gradle@v5

      # --- Simulator tests: the bindings module, and the app (QrInputLimitNativeTest checks the byte limit against Rust) ---
      - run: ./gradlew :rustyqr-bindings:iosSimulatorArm64Test :composeApp:iosSimulatorArm64Test

      # --- Regenerate iosApp.xcodeproj (Gradle owns this) ---
      - run: ./gradlew :composeApp:generateXcodeProject

      - run: test -d iosApp/iosApp.xcodeproj

      # --- Build iOS app for simulator (the Xcode script compiles the Kotlin framework and links Rust into it) ---
      # iPhone 17 exists in the macos-26 image's iOS 26.4 simulator runtime.
      - run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'platform=iOS Simulator,name=iPhone 17'

      # --- SwiftLint ---
      - run: ./gradlew :composeApp:swiftlint
