name: iOS Build

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # rust-toolchain.toml pins the version and lists every target. Without this, cargo would download the pinned
  # toolchain and all of those targets on top of what each job installs. With it, a job uses only what the action
  # installed (its own `targets:`) and fails loudly on a mismatch.
  RUSTUP_AUTO_INSTALL: "0"

jobs:
  rust-checks:
    name: Rust tests & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rustySDK

    steps:
      - uses: actions/checkout@v4

      - id: pin
        name: Read the pinned Rust version
        shell: bash
        run: |
          channel="$(awk -F'"' '/^channel[[:space:]]*=/ {print $2}' "$GITHUB_WORKSPACE/rust-toolchain.toml")"
          test -n "$channel" || { echo "::error::rust-toolchain.toml has no channel"; exit 1; }
          echo "version=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        id: toolchain
        with:
          toolchain: ${{ steps.pin.outputs.version }}
          components: clippy, rustfmt

      # Cache Rust build artifacts — keyed on Cargo.lock so it busts on dependency changes
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            rustySDK/target/
          key: rust-check-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('rustySDK/Cargo.lock') }}
          restore-keys: rust-check-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  ios-build:
    name: iOS App
    runs-on: macos-26
    needs: rust-checks

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # --- Pin Xcode version to match the one specified in iosApp/project.yml ---
      # The macos-26 image has several Xcode versions; 26.4 resolves to 26.4.1. The job depends on it, so the
      # runner image is pinned rather than macos-latest.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4'

      # --- Rust toolchain (the UniFFI Gradle plugin and Xcode run cargo; the host target is built too) ---
      - id: pin
        name: Read the pinned Rust version
        shell: bash
        run: |
          channel="$(awk -F'"' '/^channel[[:space:]]*=/ {print $2}' "$GITHUB_WORKSPACE/rust-toolchain.toml")"
          test -n "$channel" || { echo "::error::rust-toolchain.toml has no channel"; exit 1; }
          echo "version=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        id: toolchain
        with:
          toolchain: ${{ steps.pin.outputs.version }}
          targets: aarch64-apple-ios-sim

      # --- Install XcodeGen and SwiftLint (the macos-26 image has neither; :composeApp:swiftlint calls /opt/homebrew/bin) ---
      - run: brew install xcodegen swiftlint

      # Cargo registry and Rust build artifacts.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            rustySDK/target/
          key: rust-ios-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('rustySDK/Cargo.lock') }}
          restore-keys: rust-ios-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      # The Kotlin bindgen the plugin compiles with `cargo install` on its first run (several minutes). Keyed on the
      # plugin version alone, so a library bump does not discard the Rust build cache above.
      - id: plugin-version
        run: |
          version="$(sed -nE 's/^uniffi-plugin *= *"([^"]+)".*/\1/p' gradle/libs.versions.toml)"
          test -n "$version" || { echo "uniffi-plugin version not found in gradle/libs.versions.toml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: build/uniffi/bindgen/
          key: uniffi-bindgen-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ steps.plugin-version.outputs.version }}

      # Kotlin/Native toolchain and dependencies (large download on a cold runner). Keyed on the Kotlin version only.
      - id: kotlin-version
        run: |
          version="$(sed -nE 's/^kotlin *= *"([^"]+)".*/\1/p' gradle/libs.versions.toml)"
          test -n "$version" || { echo "kotlin version not found in gradle/libs.versions.toml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ steps.kotlin-version.outputs.version }}

      # --- Gradle (dependency, wrapper and build caches) ---
      - uses: gradle/actions/setup-gradle@v5

      # --- Simulator tests: the bindings module, and the app (QrInputLimitNativeTest checks the byte limit against Rust) ---
      - run: ./gradlew :rustyqr-bindings:iosSimulatorArm64Test :composeApp:iosSimulatorArm64Test

      # --- Regenerate iosApp.xcodeproj (Gradle owns this) ---
      - run: ./gradlew :composeApp:generateXcodeProject

      - run: test -d iosApp/iosApp.xcodeproj

      # --- Build iOS app for simulator (the Xcode script compiles the Kotlin framework and links Rust into it) ---
      # iPhone 17 on iOS 26.4 exists in the macos-26 image's Xcode 26.4 simulator runtime.
      - run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.4'

      # --- Lint: ktlint + detekt + swiftlint for all three modules (ktlint on iosMain/iosTest only runs on macOS) ---
      - run: ./gradlew :composeApp:lintAll
