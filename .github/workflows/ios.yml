name: iOS Build

on:
  workflow_dispatch:

# Read-only token for every job. Checkouts do not persist it either, so third-party actions never see it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    name: Rust tests & lint
    uses: ./.github/workflows/rust-checks.yml

  ios-build:
    name: iOS App
    runs-on: macos-26
    needs: rust-checks
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # --- Pin Xcode version to match the one specified in iosApp/project.yml ---
      # The macos-26 image has several Xcode versions; 26.4 resolves to 26.4.1. The job depends on it, so the
      # runner image is pinned rather than macos-latest.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4'

      # --- Rust toolchain (the UniFFI Gradle plugin and Xcode run cargo; the host target is built too) ---
      - id: rust
        uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-ios-sim
          cache-prefix: ios

      # --- Install XcodeGen and SwiftLint (the macos-26 image has neither) ---
      - run: brew install xcodegen swiftlint

      - uses: ./.github/actions/cache-uniffi-bindgen
        with:
          toolchain-key: ${{ steps.rust.outputs.cachekey }}

      # Kotlin/Native toolchain and dependencies (large download on a cold runner). Keyed on the Kotlin version only.
      - id: kotlin-version
        run: |
          version="$(sed -nE 's/^kotlin *= *"([^"]+)".*/\1/p' gradle/libs.versions.toml)"
          test -n "$version" || { echo "kotlin version not found in gradle/libs.versions.toml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ steps.kotlin-version.outputs.version }}

      # --- Android SDK: lintAll runs the type-resolved detekt tasks of composeApp and androidApp, which need it ---
      - uses: android-actions/setup-android@v4
      - run: |
          test -d "$ANDROID_HOME/platforms" \
            || { echo "no SDK platforms under $ANDROID_HOME (is the runner image SDK missing?)" >&2; exit 1; }

      # --- Gradle (dependency, wrapper and build caches) ---
      - uses: gradle/actions/setup-gradle@v5

      # --- Simulator tests: the bindings module, and the app (ContentFitNativeTest checks contentFits against the real Rust library) ---
      - run: ./gradlew :rustyqr-bindings:iosSimulatorArm64Test :composeApp:iosSimulatorArm64Test

      # --- Regenerate iosApp.xcodeproj (Gradle owns this) ---
      - run: ./gradlew generateXcodeProject

      - run: test -d iosApp/iosApp.xcodeproj

      # --- Build iOS app for simulator (the Xcode script compiles the Kotlin framework and links Rust into it) ---
      # No OS pin: the image's simulator runtimes drift (26.2, 26.4.1 and 26.5 today), so an exact OS can vanish.
      # xcodebuild takes the first iPhone 17, which builds arm64 only; a generic destination would add x86_64.
      - run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination 'platform=iOS Simulator,name=iPhone 17'

      # --- Lint: ktlint + detekt for composeApp, androidApp, rustyqr-bindings and the root scripts, ktlint for
      # build-logic, plus swiftlint (ktlint on iosMain/iosTest only runs on macOS) ---
      - run: ./gradlew lintAll
