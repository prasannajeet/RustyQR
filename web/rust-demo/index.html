<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RustyQR in the browser</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; }
    section { margin-bottom: 2rem; }
    img { display: block; margin-top: 1rem; image-rendering: pixelated; max-width: 100%; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>RustyQR in the browser</h1>
  <p id="status">Loading the Rust module...</p>

  <section>
    <h2>Generate</h2>
    <input id="content" type="text" size="40" placeholder="Text to encode" disabled>
    <button id="generate" type="button" disabled>Generate</button>
    <p id="generate-error" class="error" role="alert"></p>
    <img id="qr" alt="Generated QR code" hidden>
  </section>

  <section>
    <h2>Decode</h2>
    <input id="file" type="file" accept="image/png,image/jpeg" disabled>
    <p id="decoded"></p>
    <p id="decode-error" class="error" role="alert"></p>
  </section>

  <script type="module" src="./main.js"></script>
</body>
</html>
