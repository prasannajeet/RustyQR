#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Kotlin/Native
# Required by the UniFFI Gradle plugin (it fails configuration of :rustyqr-bindings without it): it passes the UniFFI
# Kotlin runtime's cinterop klib to the commonizer for the shared native source sets.
kotlin.mpp.enableCInteropCommonization=true

# ABIs the Rust library is built for in debug builds (comma separated, a subset of `shippedAbis` in
# androidApp/build.gradle.kts, which release builds always use). The UniFFI plugin reads this when it is applied, before
# the cargo { androidDebugAbis } DSL runs, so the DSL cannot set it; androidApp limits its debug APK to the same ABIs.
# Override it for speed, e.g. -PandroidAbis=arm64-v8a: the APK then holds only that ABI and installs only on matching
# devices.
androidAbis=arm64-v8a,armeabi-v7a,x86_64
