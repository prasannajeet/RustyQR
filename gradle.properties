#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.newDsl=false

#Kotlin/Native
kotlin.mpp.enableCInteropCommonization=true

# Debug builds of the Rust library cover the same Android ABIs as release builds. The UniFFI plugin reads this when it
# is applied, before the cargo { androidDebugAbis } DSL runs, so the DSL cannot set it. Release builds ignore it.
# Must match `shippedAbis` in androidApp/build.gradle.kts. Overriding it locally with fewer ABIs (for speed, e.g.
# -PandroidAbis=arm64-v8a) means only devices of that ABI can run that debug build.
androidAbis=arm64-v8a,armeabi-v7a,x86_64
